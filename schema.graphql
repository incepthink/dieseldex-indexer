enum TransactionType {
  ADD_LIQUIDITY
  REMOVE_LIQUIDITY
  SWAP
}

type Pool {
  id: ID!
  asset_0: String!
  asset_1: String!
  is_stable: Boolean!
  reserve_0: BigInt!
  reserve_1: BigInt!
  create_time: Int!
  decimals_0: Int!
  decimals_1: Int!
  tvl: BigInt!
  tvlUSD: Float!
  lpId: String!
  swapVolume: Float!
}

type Asset {
  id: ID!
  exchange_rate_usdc: Float!
  exchange_rate_eth: Float!
  exchange_rate_fuel: Float!
}

type Transaction {
  id: ID!
  transaction_type: TransactionType! @index
  pool_id: String! @index
  initiator: String! @index
  is_contract_initiator: Boolean!
  asset_0_in: BigInt!
  asset_0_out: BigInt!
  asset_1_in: BigInt!
  asset_1_out: BigInt!
  block_time: Int! @index
  extra: String
  lp_id: String
  lp_amount: BigInt
  time: Int!
}

type SwapDaily {
  id: ID!
  pool_id: String! @index
  snapshot_time: Int! @index
  count: Int!
  asset_0_in: BigInt!
  asset_0_out: BigInt!
  asset_1_in: BigInt!
  asset_1_out: BigInt!
  feesUSD: Float!
  volume: Float!
}

type SwapHourly {
  id: ID!
  pool_id: String! @index
  snapshot_time: Int! @index
  count: Int!
  asset_0_in: BigInt!
  asset_0_out: BigInt!
  asset_1_in: BigInt!
  asset_1_out: BigInt!
  feesUSD: Float!
  volume: Float!
}

type DeDuplicator {
  id: ID!
  additionalDuplications: Int!
}

type RawCreatePoolEvent {
  id: ID!
  pool_id: String!
  decimals_0: Int!
  decimals_1: Int!
  logIndex: Int!
  transactionId: String!
  blockId: String!
  blockHeight: Int!
}

type RawMintEvent {
  id: ID!
  pool_id: String!
  recipient: String!
  liquidity: String!
  asset_0_in: BigInt!
  asset_1_in: BigInt!
  logIndex: Int!
  transactionId: String!
  blockId: String!
  blockHeight: Int!
}

type RawBurnEvent {
  id: ID!
  pool_id: String!
  recipient: String!
  liquidity: String!
  asset_0_out: BigInt!
  asset_1_out: BigInt!
  logIndex: Int!
  transactionId: String!
  blockId: String!
  blockHeight: Int!
}

type RawSwapEvent {
  id: ID!
  pool_id: String!
  recipient: String!
  asset_0_in: BigInt!
  asset_1_in: BigInt!
  asset_0_out: BigInt!
  asset_1_out: BigInt!
  logIndex: Int!
  transaction_id: String!
  blockId: String!
  block_height: Int!
  exchange_rate: BigInt!
  is_buy: Boolean!
  is_sell: Boolean!
  time: Int!
}

type BridgeFungibleToken_TotalSupplyEvent {
  id: ID!
  asset: String!
  supply: BigInt!
  sender: String!
  time: Int!
  block_height: Int!
  transaction_id: String!
}

type Diesel_TotalSupplyEvent {
  id: ID!
  time: Int!
  block_height: Int!
  transaction_id: String!
  asset: String!
  supply: BigInt!
  sender: String!
}

type CurveViolation {
  id: ID!
  tx_id: String!
  pool_id: String!
  block_time: Int!
  reserve_0: BigInt!
  reserve_1: BigInt!
  new_reserve_0: BigInt!
  new_reserve_1: BigInt!
  asset_0_in: BigInt!
  asset_1_in: BigInt!
  asset_0_out: BigInt!
  asset_1_out: BigInt!
  k_0: String!
  k_1: String!
}
